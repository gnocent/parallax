name: Release

# Sur un tag vN.N.N : rejoue "make check" (spécification, compilation, vet,
# tests — la même commande qu'en local, aucune duplication de logique), puis
# construit les trois binaires de poste de travail et les attache à la
# release GitHub. Aucune installation requise côté utilisateur : télécharger
# le binaire suffit (CGO désactivé, pilote SQLite pur Go).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe (Makefile) a besoin des tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # la version exigée par le module, jamais une seconde source de vérité

      - name: Vérifier
        run: make check

      - name: Construire les binaires
        run: make release-tous

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        # un tag avec suffixe (v0.7.0-beta, v1.0.0-rc1) publie une pré-version
        run: |
          prerelease=""
          case "${{ github.ref_name }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" \
            bin/parallax#parallax-linux-amd64 \
            bin/parallax-windows-amd64.exe \
            bin/parallax-macos-arm64 \
            --title "${{ github.ref_name }}" \
            --generate-notes $prerelease
